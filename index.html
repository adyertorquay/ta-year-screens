<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Year Group Screens</title>
<link rel="icon" type="image/png" href="media/ta-logo.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="backend.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap">
<style>
/* Layout: the TV screen is a fixed 1920x1080 stage scaled to fit (header, spotlight + "up next" column, ticker, house-colour band).
   Editing pages are a plain two-column tool: form on the left, live preview of the screen on the right. */
/* Torquay Academy look, from the Tutor Slides sign-in page: deep maroon on a wine-black ground (dark, the default),
   plain white ground in light mode; Open Sans text with Arial bold titles; the official house palette.
   Layout: TV screens are fixed stages (1920x1080 centre, 1080x1920 sides) scaled to fit; editing pages are a form beside a live preview. */
:root {
  --bg: #150911; --panel: #241019; --panel-2: #2b1420; --line: #3a2029; --ink: #F7EEF1; --muted: #B79AA4;
  --maroon: #8A1A4D; --maroon-2: #6f1440; --hot: #D23A6C; --rose: #EBA7BE;
  --wash: rgba(255,255,255,.055); --glow-1: rgba(210,58,108,.13); --glow-2: rgba(138,26,77,.17); --logo-inv: 1;
  --paper: var(--bg); --accent: var(--maroon); --accent-ink: #ffffff; --link: var(--rose);
  --ok: #3BB273; --warn: #E6A93C; --bad: #E24B5B;
  --display: Arial, Helvetica, "Liberation Sans", sans-serif;
  --body: "Open Sans", "Segoe UI", system-ui, sans-serif;
  --tv-bg: var(--bg); --tv-card: var(--panel); --tv-ink: var(--ink); --tv-dim: var(--muted); --tv-line: var(--line);
  --h-brunel: #3954A5; --h-christie: #88CDEA; --h-darwin: #ED2226; --h-fawcett: #FDE900;
  --h-harrison: #F78F1E; --h-kitson: #139C4C; --h-nearne: #54C3BD; --h-pengelly: #6F439A;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #ffffff; --panel: #f3f0f2; --panel-2: #eae5e9; --line: #d8d0d6; --ink: #141014; --muted: #6b616a; --rose: #8A1A4D;
  --wash: rgba(20,16,20,.045); --glow-1: rgba(210,58,108,.06); --glow-2: rgba(138,26,77,.05); --logo-inv: 0;
  --paper: #f6f3f5; --ok: #1E8A55; --warn: #B07400; --bad: #CE3040; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #ffffff; --panel: #f3f0f2; --panel-2: #eae5e9; --line: #d8d0d6; --ink: #141014; --muted: #6b616a; --rose: #8A1A4D;
  --wash: rgba(20,16,20,.045); --glow-1: rgba(210,58,108,.06); --glow-2: rgba(138,26,77,.05); --logo-inv: 0;
  --paper: #f6f3f5; --ok: #1E8A55; --warn: #B07400; --bad: #CE3040; color-scheme: light }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: radial-gradient(1400px 900px at 90% -10%, var(--glow-1), transparent 60%), var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.ta-logo { filter: invert(var(--logo-inv)); width: auto; display: block; }
body.tv { background: var(--bg); overflow: hidden; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }
a { color: var(--link); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }

/* ---------- shared tool chrome ---------- */
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .ta-logo { height: 52px; }
.brand .tagline { font-family: var(--display); font-style: italic; color: var(--rose); font-size: 1rem; }
.brand h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 700; font-size: .92rem; }
.btn:hover { border-color: var(--hot); }
.btn.primary { background: var(--maroon); color: #fff; border-color: var(--maroon); box-shadow: 0 10px 24px -14px var(--maroon); }
.btn.primary:hover { background: var(--hot); border-color: var(--hot); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.note { color: var(--muted); font-size: .9rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--link); font: inherit; text-decoration: underline; cursor: pointer; }
/* Staff sign-in and team pages */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
.signin-card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px 28px; box-shadow: 0 30px 60px -40px rgba(0,0,0,.6); text-align: center; display: flex; flex-direction: column; gap: 14px; }
.signin-card .ta-logo { height: 92px; margin: 0 auto 6px; }
.signin-card h1 { font-family: var(--display); font-size: 1.6rem; letter-spacing: -.02em; }
.signin-card .tagline { font-family: var(--display); font-style: italic; color: var(--rose); margin-top: -8px; }
.signin-card p { color: var(--muted); }
.signin-card .btn { justify-content: center; padding: 11px 16px; }
.signin-card .values { font-size: .72rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--rose); margin-top: 8px; }
.si-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.si-form .btn { margin-top: 4px; }
.form-msg { color: var(--bad); font-size: .9rem; min-height: 1.2em; margin: 0; }
.demo-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 16px; display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--muted); box-shadow: 0 10px 30px -15px rgba(0,0,0,.6); }
body.tv .demo-bar { display: none; }
.signin-card .years-go { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.signin-card .years-go .btn:first-child:last-child { grid-column: 1 / -1; }
.signin-card .foot { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: .9rem; }
.who { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-weight: 600; margin: 0 auto; max-width: 100%; }
.who img { width: 30px; height: 30px; border-radius: 50%; flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .who { margin: 0; padding-block: 4px; font-size: .9rem; }
.topbar .who img { width: 26px; height: 26px; }
.staff-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.staff-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.staff-row .yrs { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.chk:has(input:checked) { background: var(--maroon); border-color: var(--maroon); color: #fff; }
.chk input { accent-color: var(--hot); margin: 0; }
.hits { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.hits button { justify-content: flex-start; }
@media (max-width: 720px) { .staff-row { grid-template-columns: 1fr; } }

.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; }
.pill.sample { color: var(--warn); }
.pill.live { color: var(--ok); }

/* ---------- home ---------- */
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
.ycard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.ycard h2 { font-size: 2.2rem; font-weight: 700; letter-spacing: -.02em; }
.ycard .stats { font-size: .9rem; color: var(--muted); min-height: 2.6em; }
.ycard .row { display: flex; gap: 8px; flex-wrap: wrap; }
.howto { margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; }
.howto h3 { font-size: 1.1rem; margin-bottom: 6px; }
.howto p { margin: 0; color: var(--muted); max-width: 60ch; }

/* ---------- editor ---------- */
.yeartabs { display: flex; gap: 4px; flex-wrap: wrap; }
.yeartabs a { padding: 6px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 700; }
.yeartabs a[aria-current="page"] { background: var(--maroon); color: #fff; }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 28px; margin-top: 20px; align-items: start; }
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 10px; }
.preview .frame { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--tv-bg); box-shadow: 0 10px 30px rgba(0,0,0,.18); position: relative; }
.savebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.savebar .status { font-size: .9rem; color: var(--muted); }
.savebar .status.bad { color: var(--bad); }
.savebar .status.ok { color: var(--ok); }
.banner { background: var(--panel); border: 1px solid var(--warn); color: var(--ink); border-radius: 8px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
fieldset { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 18px; margin: 0 0 18px; min-width: 0; }
legend { font-family: var(--display); font-weight: 700; font-size: 1.2rem; padding: 0 6px; }
.hint { margin: -2px 0 12px; color: var(--muted); font-size: .9rem; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; font-weight: 700; color: var(--muted); min-width: 0; }
input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; font-weight: 400; color: var(--ink); box-sizing: border-box; }
textarea { min-height: 70px; resize: vertical; }
.items { display: flex; flex-direction: column; gap: 12px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: end; }
.item .wide { grid-column: 1 / -1; }
.item .tools { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.thumb { width: 96px; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; background: var(--line); }
.empty { color: var(--muted); font-style: italic; padding: 6px 0; }
.houses-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.houses-form label { border-left: 6px solid var(--hc); padding-left: 8px; }
.ltable-wrap { overflow-x: auto; }
table.lt { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
table.lt th, table.lt td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.lt th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
@media (max-width: 960px) { .editor { grid-template-columns: minmax(0, 1fr); } .preview { position: static; order: -1; } }

/* ---------- TV stage ---------- */
.tvroot { position: fixed; inset: 0; background: var(--tv-bg); overflow: hidden; }
.fit { position: absolute; inset: 0; overflow: hidden; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: radial-gradient(1500px 1000px at 84% -24%, var(--glow-1), transparent 55%), radial-gradient(1200px 900px at -14% 120%, var(--glow-2), transparent 55%), var(--tv-bg); color: var(--tv-ink); font-family: var(--body); display: grid; grid-template-rows: 150px 1fr 76px 14px; overflow: hidden; }
.tv-top { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 40px; padding: 0 56px; }
.tv-top .ta-logo { height: 112px; }
.tv-year { font-family: var(--display); font-weight: 700; font-size: 104px; letter-spacing: -.02em; line-height: 1; }
.tv-motto { font-family: var(--display); font-style: italic; font-size: 40px; color: var(--rose); }
.tv-clock { text-align: right; display: flex; flex-direction: column; }
.tv-clock .time { font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 1; font-variant-numeric: tabular-nums; }
.tv-clock .date { font-size: 28px; color: var(--tv-dim); margin-top: 6px; }
.tv-main { display: grid; grid-template-columns: 1120px 1fr; gap: 32px; padding: 6px 56px 28px; min-height: 0; }
.spot { position: relative; border-radius: 22px; overflow: hidden; background: var(--tv-card); min-height: 0; }
.slide { position: absolute; inset: 0; transition: opacity .8s ease; opacity: 0; display: flex; flex-direction: column; }
.slide.on { opacity: 1; }
.spot-dots { position: absolute; left: 44px; bottom: 30px; display: flex; gap: 10px; z-index: 3; }
.spot-dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.spot-dots i.on { background: var(--hot); width: 40px; border-radius: 7px; }
.s-pad { padding: 52px 56px 80px; display: flex; flex-direction: column; gap: 24px; height: 100%; box-sizing: border-box; }
.s-eyebrow { font-size: 26px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tv-dim); }
.s-title { font-family: var(--display); font-weight: 700; font-size: 92px; line-height: 1.02; letter-spacing: -.02em; }
.s-body { font-size: 40px; line-height: 1.35; color: var(--tv-ink); max-width: 30ch; white-space: pre-line; }
.s-meta { margin-top: auto; font-size: 28px; color: var(--tv-dim); }
.slide.notice { background: linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, var(--tv-card)) 0%, var(--tv-card) 70%); }
.slide.notice .s-eyebrow { color: var(--rose); }
.slide.celebrate.text { background: radial-gradient(rgba(255,255,255,.07) 3px, transparent 3.6px) 0 0 / 30px 30px, linear-gradient(150deg, var(--maroon) 0%, #4a0d29 100%); color: #fff; }
.slide.celebrate.text::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--c); }
.slide.celebrate.text .s-pad { justify-content: flex-end; }
.slide.celebrate.text .s-title { font-size: 112px; max-width: 15ch; }
.slide.celebrate.text .s-eyebrow, .slide.celebrate.text .s-meta { color: #EBA7BE; }
.slide.celebrate.text .s-body { color: #fff; }
.slide.celebrate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide.celebrate .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 140px 56px 74px; background: linear-gradient(transparent, rgba(21,9,17,.92) 55%); color: #F7EEF1; }
.slide.celebrate .cap .s-eyebrow { color: #EBA7BE; } .slide.celebrate .cap .s-body { color: #F7EEF1; }
.slide.celebrate .cap .s-title { font-size: 72px; }
.slide.celebrate .cap .s-body { font-size: 32px; margin-top: 10px; }
.sotw-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; flex: 1; align-content: start; }
.sotw-grid.n1 { grid-template-columns: 1fr; }
.sotw-card { background: var(--wash); border-radius: 18px; padding: 24px 28px; border-top: 8px solid var(--c); min-width: 0; }
.sotw-card b { display: block; font-family: var(--display); font-weight: 700; font-size: 50px; line-height: 1.05; }
.sotw-card span { display: block; font-size: 26px; color: var(--tv-dim); margin-top: 6px; }
.sotw-card p { margin: 12px 0 0; font-size: 28px; line-height: 1.3; }
.slide.sotw .s-title { font-size: 76px; }
.slide.welcome { justify-content: center; }
.side { display: grid; grid-template-rows: 1fr auto; gap: 24px; min-height: 0; }
.panel { background: var(--tv-card); border-radius: 22px; padding: 26px 32px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.panel .s-eyebrow { font-size: 22px; }
.next-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.next-head h2 { font-size: 54px; font-weight: 700; }
.next-when { font-size: 28px; color: var(--tv-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
.next-when b { color: var(--tv-ink); }
.next-list { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-content: start; flex: 1; min-height: 0; overflow: hidden; }
.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 8px 14px; border-radius: 12px; background: var(--wash); min-width: 0; font-size: 26px; }
.lrow .g { font-family: var(--display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
.lrow .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .r { font-family: var(--display); font-weight: 700; color: var(--tv-dim); white-space: nowrap; font-variant-numeric: tabular-nums; max-width: 7ch; overflow: hidden; text-overflow: ellipsis; }
.next-list.dense .lrow { padding: 7px 12px; font-size: 23px; }
.next-list.dense .lrow .g { font-size: 24px; }
.next-list.xdense { gap: 6px 10px; }
.next-list.xdense .lrow { padding: 4px 10px; font-size: 21px; }
.next-list.xdense .lrow .g { font-size: 22px; }
.next-empty { font-size: 28px; color: var(--tv-dim); margin-top: 18px; }
.src { font-size: 20px; color: var(--tv-dim); margin-top: 12px; }
.bars { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(4, auto); gap: 10px 36px; margin-top: 14px; }
.bar { display: grid; grid-template-columns: 112px 1fr 56px; gap: 10px; align-items: center; font-size: 22px; }
.bar .track { height: 16px; border-radius: 8px; background: var(--wash); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 8px; background: var(--c); }
.bar .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar.lead .n { font-weight: 700; }
.tv-ticker { display: flex; align-items: center; overflow: hidden; background: var(--maroon); color: #fff; font-size: 32px; font-weight: 700; white-space: nowrap; }
.tv-ticker .lab { flex: none; background: var(--maroon-2); color: #fff; height: 100%; display: flex; align-items: center; padding: 0 30px; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 26px; }
.tick-view { overflow: hidden; flex: 1; }
.tick-track { display: inline-block; padding-left: 100%; animation: tick var(--dur, 40s) linear infinite; }
.tick-track span { margin-right: 90px; }
.tick-track span::before { content: "\2605"; margin-right: 22px; color: #EBA7BE; font-size: 26px; vertical-align: 2px; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-100%); } }
.band { display: grid; grid-template-columns: repeat(8, 1fr); }
.tv-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--tv-ink); font-size: 22px; padding: 24px; }
.takeover { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin; text-align: center; padding: 6vmin;
  background: radial-gradient(circle at 50% 40%, #b0245f, #8A1A4D 45%, #4a0d29 100%); color: #fff; animation: to-in .5s ease-out; }
.takeover .ta-logo { height: 18vmin; filter: invert(1); }
.to-text { font-family: var(--display); font-weight: 700; font-size: 13vmin; line-height: 1; letter-spacing: -.02em; max-width: 16ch; text-wrap: balance; animation: to-pulse 2s ease-in-out infinite; }
.to-sub { font-weight: 600; font-size: 2.6vmin; letter-spacing: .22em; text-transform: uppercase; color: #EBA7BE; }
@keyframes to-in { from { opacity: 0; transform: scale(1.04); } }
@keyframes to-pulse { 50% { transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .takeover, .to-text { animation: none; } }
.tvctl { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; display: flex; gap: 8px; z-index: 10; transition: opacity .4s; }
.tvctl a, .tvctl button { background: rgba(36,16,25,.85); color: #F7EEF1; border: 1px solid #3a2029; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 14px; text-decoration: none; cursor: pointer; }
.tvctl.idle { opacity: 0; pointer-events: none; }
/* ---------- portrait side screens (1080x1920) ---------- */
.stage.portrait { width: 1080px; height: 1920px; grid-template-rows: 236px 1fr auto 14px; }
.p-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; padding: 0 56px 30px; }

// Light/dark: dark is the school default. A choice made on a device is remembered on that device.
const THEME_KEY = 'ta_screens_theme';
const currentTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
try { const t = localStorage.getItem(THEME_KEY); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
function themeBtn(cls = 'btn ghost') {
  const b = h('button', { class: cls, type: 'button' });
  const sync = () => { b.textContent = currentTheme() === 'dark' ? 'Light mode' : 'Dark mode'; };
  b.addEventListener('click', () => { setTheme(currentTheme() === 'dark' ? 'light' : 'dark'); sync(); });
  sync(); return b;
}

// Tutor groups are named after their house (7B = Brunel, 7C = Christie ...), so a group's colour is its house colour.
const GROUP_LETTERS = ['B', 'C', 'D', 'F', 'H', 'K', 'N', 'P'];
const groupIndex = g => { const m = /([A-Z])\s*$/i.exec(String(g || '').trim()); return m ? GROUP_LETTERS.indexOf(m[1].toUpperCase()) : -1; };
const groupColor = g => { const i = groupIndex(g); return i >= 0 ? HC[i] : 'var(--tv-dim)'; };
// Some years name tutor groups differently (Year 11: Q5 to Q9, T4 to T9). The centre screen's "Tutor groups" setting lists them;
// empty means the house letters. Groups that aren't a house letter get the school accent and no mascot.
const groupsOf = centre => { const g = centre && Array.isArray(centre.groups) ? centre.groups.map(x => String(x).trim()).filter(Boolean) : []; return g.length ? g : GROUP_LETTERS; };
const suffixColor = L => { const i = GROUP_LETTERS.indexOf(String(L).toUpperCase()); return i >= 0 ? HC[i] : 'var(--hot)'; };
const SIDES = { left: 'Left', right: 'Right' };
const SEG = ['#5bbf4a', '#ff9f1a', '#f2c514', '#e5383b', '#8a90a0'];
const SLIDE_TYPES = {
  list: { label: 'Names list', hint: 'Learning Legends, Helpzone, or any list of students. One per line, e.g. "Sam Smith, 7B".' },
  stat: { label: 'Tutor group race', hint: 'One number per tutor group, e.g. Sparx Reader average score. House mascots race along the bars.' },
  breakdown: { label: 'Year breakdown', hint: 'Parts of the year that add up to 100%, e.g. how many are on 100% in Sparx Maths.' },
  table: { label: 'Leaderboard', hint: 'Copy rows from a spreadsheet and paste them here. The first row is the headings. Top 15 show.' },
  birthdays: { label: 'Birthdays', hint: 'Shows yesterday, today and tomorrow automatically from the dates below.' },
  value: { label: 'Value of the week', hint: '' },
  poster: { label: 'Poster or GIF', hint: 'A full-screen image or animated GIF. Portrait (9:16) fits best. GIFs up to 20 MB.' },
  info: { label: 'Information', hint: 'Lines starting with "- " become bullets. "- 25% Attendance: detail" becomes a big tile.' },
  housepoints: { label: 'House points', hint: 'Shows the house points entered on the centre screen.' },
  sotw: { label: 'Students of the week', hint: 'Shows the students entered on the centre screen.' },
  week: { label: 'Week A/B', hint: 'Shows which timetable week it is, e.g. Week B, teaching week 5. Worked out automatically from the school week plan.' },
};
const SLIDE_DEFAULTS = {
  list: { title: '', subtitle: '', items: '', emptyText: '' },
  stat: { title: '', metric: '', unit: '', values: {} },
  breakdown: { title: '', metric: '', segments: [{ label: '', value: 0 }] },
  table: { title: '', subtitle: '', rows: '' },
  birthdays: { title: 'Happy birthday!', people: '' },
  value: { title: 'Value of the week', value: '', text: '', photo: '' },
  poster: { title: '', photo: '' },
  info: { title: '', body: '' },
  housepoints: { title: 'House points' },
  sotw: {},
  week: { title: '', week: '', teachingWeek: '' },
};
const newSlide = type => ({ id: uid(), type, hidden: false, ...clone(SLIDE_DEFAULTS[type] || {}) });
const normalSide = d => Object.assign({ slides: [], slideSeconds: 12 }, d ? clone(d) : {});
const lines = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
const splitPerson = line => { const p = line.split(/\t| [-–] |,\s*/); return { name: (p[0] || '').trim(), group: (p[1] || '').trim(), extra: (p[2] || '').trim() }; };
const parseTable = t => lines(t).map(l => (l.includes('\t') ? l.split('\t') : l.split(/\s*,\s*/)).map(c => c.trim()));
const fmtNum = v => (Math.round(v * 10) / 10).toLocaleString('en-GB');
const dayKey = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
function birthdaysOn(people, d) {
  const key = dayKey(d);
  return lines(people).map(splitPerson).filter(p => { const m = /^(\d{1,2})[\/.\-](\d{1,2})/.exec(p.extra); return m && m[1].padStart(2, '0') + '/' + m[2].padStart(2, '0') === key; });
}
function hasContent(s, centre) {
  switch (s.type) {
    case 'list': return !!(s.title && (lines(s.items).length || s.emptyText));
    case 'stat': return Object.values(s.values || {}).some(v => +v > 0);
    case 'breakdown': return (s.segments || []).some(x => +x.value > 0);
    case 'table': return parseTable(s.rows).length > 1;
    case 'birthdays': return [-1, 0, 1].some(o => { const d = new Date(); d.setDate(d.getDate() + o); return birthdaysOn(s.people, d).length; });
    case 'value': return !!s.value;
    case 'poster': return !!s.photo;
    case 'info': return !!(s.title || s.body);
    case 'housepoints': return Object.values(centre.housePoints || {}).some(v => +v > 0);
    case 'sotw': return centre.sotw.students.some(x => x.name);
    case 'week': return !!(s.week || weekInfo(new Date()));
  }
  return false;
}

let db = null, assets = null, user = null, dbState = 'loading';

// House points synced from Arbor (housepoints/<year>, else housepoints/all) replace the typed-in ones.
const syncedHP = y => { const d = store.hp[y] || store.hp.all; return d && d.points ? d : null; };
function withHP(y) { const raw = store.rawCentre[y], hp = syncedHP(y); store.screens[y] = hp ? Object.assign({}, raw || {}, { housePoints: hp.points }) : raw; }
const subs = {};
const listeners = new Set();
function subscribe(y) {
  if (!db || subs[y]) return;
  if (!subs._hpall) subs._hpall = db.doc('housepoints/all').onSnapshot(s => { store.hp.all = s.exists ? s.data() : null; YEARS.forEach(yy => { withHP(yy); emit(yy); }); }, e => console.warn('hp', e));
  if (!subs._hw) subs._hw = Object.keys(HOMEWORK).map(k => db.doc('homework/' + k).onSnapshot(s => { store.homework[k] = s.exists ? s.data() : null; YEARS.forEach(emit); emit('homework'); }, e => console.warn('homework', e)));
  if (!subs._config) subs._config = db.doc('config/houses').onSnapshot(s => { store.mascots = s.exists ? (s.data().mascots || null) : null; YEARS.forEach(emit); }, e => console.warn('config', e));
  subs[y] = [
    ...['left', 'right'].map(side => db.doc('screens/' + y + '-' + side).onSnapshot(s => { store.screens[y + '-' + side] = s.exists ? s.data() : null; emit(y); }, e => console.warn('side', e))),
    db.doc('screens/' + y).onSnapshot(s => { store.rawCentre[y] = s.exists ? s.data() : null; withHP(y); store.seen[y] = true; emit(y); }, e => console.warn('screen', e)),
    db.doc('housepoints/' + y).onSnapshot(s => { store.hp[y] = s.exists ? s.data() : null; withHP(y); emit(y); }, e => console.warn('hp', e)),
    db.doc('lessons/' + y).onSnapshot(s => { store.lessons[y] = s.exists ? s.data() : null; emit(y); }, e => console.warn('lessons', e)),
    db.doc('timetable/' + y).onSnapshot(s => { store.timetable[y] = s.exists ? s.data() : null; emit(y); }, e => console.warn('timetable', e)),
  ];
}
function emit(y) { for (const fn of listeners) fn(y); }

// ---------- school calendar 2026-27 ----------
// Term dates from the school, for which days are school days.
const TERMS = [['2026-09-03', '2026-10-23'], ['2026-11-02', '2026-12-18'], ['2027-01-04', '2027-02-12'],
  ['2027-02-22', '2027-03-25'], ['2027-04-12', '2027-05-28'], ['2027-06-07', '2027-07-16']];
const NON_PUPIL_DAYS = new Set(['2027-07-02', '2027-07-05']);
// The school's week plan, copied from its calendar: Monday, timetable week (A, B or - for none), week number,
// and what kind of week it is when it isn't a normal teaching week. Holiday weeks are simply left out.
const WEEK_PLAN = `
2026-08-31 A - TA Way
2026-09-07 B 1
2026-09-14 A 2
2026-09-21 B 3
2026-09-28 A 4
2026-10-05 B 5
2026-10-12 A 6
2026-10-19 B 7
2026-11-02 A 8
2026-11-09 B 1 Assessment week
2026-11-16 A 1 Super Teaching week
2026-11-23 B 1
2026-11-30 A 2
2026-12-07 B 3
2026-12-14 A 4
2027-01-04 B 5
2027-01-11 A 6
2027-01-18 B 7
2027-01-25 A 1 Assessment week
2027-02-01 B 1 Super Teaching week
2027-02-08 A 1
2027-02-22 B 2
2027-03-01 A 3
2027-03-08 B 4
2027-03-15 A 5
2027-03-22 B 6
2027-04-12 A 7
2027-04-19 B 1 Assessment week
2027-04-26 A 1 Super Teaching week
2027-05-03 B 1
2027-05-10 A 2
2027-05-17 B 3
2027-05-24 A 4
2027-06-07 B 5
2027-06-14 A 6
2027-06-21 B 7
2027-06-28 A 1 Synoptic Assessment week
2027-07-05 B 1 Super Teaching week
2027-07-12 - - Activities Week
`.trim().split('\n').map(l => { const [monday, letter, n, ...rest] = l.trim().split(/\s+/);
  return { monday, letter: letter === '-' ? '' : letter, teaching: n === '-' ? null : +n, label: rest.join(' ') }; });
const isoDay = d => todayISO(d);
const mondayOf = d => { const m = new Date(d.getFullYear(), d.getMonth(), d.getDate()); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
const termIndex = d => { const k = isoDay(d); return TERMS.findIndex(([a, b]) => k >= a && k <= b); };
const isSchoolDay = d => d.getDay() >= 1 && d.getDay() <= 5 && termIndex(d) >= 0 && !NON_PUPIL_DAYS.has(isoDay(d));
// The week a date falls in. In a holiday it gives the week school returns in.
function weekInfo(d) {
  const k = isoDay(mondayOf(d));
  return WEEK_PLAN.find(w => w.monday >= k) || null;
}
// "Teaching week 5", or the kind of week, e.g. "Assessment week".
const weekLine = w => !w ? '' : w.label || (w.teaching ? 'Teaching week ' + w.teaching : '');
// Lessons for the period about to start: from the A/B timetable when there is one, else the simple feed.
function lessonRows(y, les, np) {
  const tt = store.timetable && store.timetable[y];
  if (tt && tt.weeks) { const w = weekInfo(np.date); const day = w && tt.weeks[w.letter] && tt.weeks[w.letter][np.date.getDay()]; return (day && day[np.p]) || []; }
  return (les && les.periods && les.periods[np.p]) || [];
}
function lessonSource(y, les, np) {
  const tt = store.timetable && store.timetable[y];
  if (tt && tt.weeks) { const w = weekInfo(np.date); return w && w.letter ? 'Week ' + w.letter + ' timetable' : ''; }
  return !les ? '' : les.source === 'arbor' ? 'From Arbor' + (les.syncedAt ? ', updated ' + new Date(les.syncedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '') : 'Sample timetable. Arbor will supply this.';
}
const hasLessons = (y, les) => !!(les || (store.timetable && store.timetable[y]));

function nextPeriod(now) {
  const m = now.getHours() * 60 + now.getMinutes();
  if (isSchoolDay(now)) for (const b of BELLS) if (toMin(b.start) > m) return { ...b, inMin: toMin(b.start) - m, today: true, date: now };
  const d = new Date(now); let guard = 0; do d.setDate(d.getDate() + 1); while (!isSchoolDay(d) && ++guard < 120);
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const dayLabel = d.toDateString() === tomorrow.toDateString() ? 'Tomorrow' : d.toLocaleDateString('en-GB', { weekday: 'long' });
  return { ...BELLS[0], today: false, dayLabel, date: d };
}

    if (!dirty) { const keep = document.activeElement && document.activeElement.id; loadRemote(); if (keep) { const el = document.getElementById(keep); el && el.focus(); } }
    else if (!saving) { pendingRemote = true; banner.hidden = false; }
  };
  listeners.add(onData);
  buildForm(); stage.setData(draft, store.lessons[y]); subscribe(y);
  if (dbState === 'off') setStatus('Sign in to load and save this screen.', 'bad');
  if (user && user.can) Promise.resolve(user.can('data.write')).then(ok => { if (ok === false) { readOnly = true; saveBtn.disabled = true; setStatus('View only. Ask the screens administrator for edit access.'); buildForm(); } }).catch(() => {});
  const beforeUnload = e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', beforeUnload);
  cleanup = () => { listeners.delete(onData); stage.destroy(); window.removeEventListener('beforeunload', beforeUnload); };
}

function editorTop(y, side) {
  const link = (yy, s) => '#edit-' + yy + (s === 'centre' ? '' : '-' + s);
  return h('div', { style: 'display:flex;flex-direction:column;gap:14px' },
    h('div', { class: 'topbar' },
      h('div', { class: 'brand' }, stripe(), h('h1', { text: 'Edit ' + yearName(y) + ' screens' })),
      h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, h('nav', { class: 'yeartabs', 'aria-label': 'Year groups' }, h('a', { href: '#', text: 'All' }), YEARS.filter(yy => !currentAccess || currentAccess.years.includes(yy)).map(yy => h('a', { href: link(yy, side), 'aria-current': yy === y ? 'page' : null, text: yearName(yy) }))), editorWho(), themeBtn())),

function formKit(touch) {
  const field = (label, id, value, oninput, type = 'text', extra = {}) => {
    const inp = type === 'textarea' ? h('textarea', { id, ...extra }) : h('input', { id, type, ...extra });
    inp.value = value ?? '';
    inp.addEventListener('input', () => { oninput(type === 'number' ? (inp.value === '' ? 0 : +inp.value) : inp.value); touch(); });
    return h('label', { class: 'f', for: id }, label, inp);
  };
  const removeBtn = (arr, i, rerender) => h('button', { class: 'btn small ghost', type: 'button', onclick: () => { arr.splice(i, 1); touch(); rerender(); }, text: 'Remove' });
  const moveBtns = (arr, i, rerender) => h('span', {},
    h('button', { class: 'btn small ghost', type: 'button', disabled: i === 0, 'aria-label': 'Move up', onclick: () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; touch(); rerender(); }, text: '↑' }), ' ',
    h('button', { class: 'btn small ghost', type: 'button', disabled: i === arr.length - 1, 'aria-label': 'Move down', onclick: () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; touch(); rerender(); }, text: '↓' }));

}

async function uploadImage(file) {
  const isGif = file.type === 'image/gif';
  if (isGif && file.size > 20 * 1024 * 1024) throw { code: 'too_big' };
  const blob = isGif ? file : await shrink(file);
  const res = await assets.upload(blob, { type: blob.type || 'image/jpeg' });
  return res.id;
}
const uploadError = e => e && e.code === 'too_big' ? 'That GIF is over 20 MB. Make it shorter or smaller and try again.'
  : e && e.code === 'quota_exceeded' ? 'Image storage is full. Remove old images first.' : 'That image could not be uploaded. Try a JPG, PNG or GIF under 20 MB.';

function viewEditSide(y, side) {
  const key = y + '-' + side;
  let draft = normalSide(store.screens[key]);
  let seen = JSON.stringify(store.screens[key] || null);
  let dirty = false, saving = false, readOnly = false;
  const status = h('span', { class: 'status', 'aria-live': 'polite' });
  const saveBtn = h('button', { class: 'btn primary', type: 'button', onclick: save, text: 'Save' });

  const banner = h('div', { class: 'banner', hidden: true }, h('span', { text: 'Someone else has saved changes to this screen.' }),
    h('button', { class: 'btn small', type: 'button', onclick: () => loadRemote(), text: 'Load their version' }));
  const frame = h('div', { class: 'frame portrait' });

  let pT; const preview = () => { clearTimeout(pT); pT = setTimeout(refresh, 150); };
  function setStatus(t, cls = '') { status.textContent = t; status.className = 'status ' + cls; }
  const touch = () => { dirty = true; setStatus('Unsaved changes'); preview(); };
  const { field, removeBtn, moveBtns } = formKit(touch);
  let selected = null;
  function focusSlide(id) {
    if (id === selected) return;
    selected = id; stage.pin(id); playBtn.hidden = !id;
    form.querySelectorAll('.scard').forEach(el => el.classList.toggle('sel', el.id === 'sc-' + id));
  }

  function photoRow(s, rerender) {
    const fileId = 'sl-' + s.id + '-file';
    const up = assets ? h('label', { class: 'btn small', for: fileId }, s.photo ? 'Replace image' : 'Add image',
      h('input', { id: fileId, type: 'file', accept: 'image/*', hidden: true, onchange: async e => {
        const f = e.target.files[0]; if (!f) return;
        setStatus('Uploading image…');
        try { s.photo = await uploadImage(f); touch(); rerender(); setStatus('Image added. Save to put it on screen.'); }
        catch (err) { setStatus(uploadError(err), 'bad'); }
      } })) : h('span', { class: 'note', text: 'Image upload needs Editor access.' });
    return h('div', { class: 'wide', style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' },
      s.photo ? h('img', { class: 'thumb', src: photoUrl(s.photo), alt: '' }) : h('div', { class: 'thumb' }), up,
      s.photo ? h('button', { class: 'btn small ghost', type: 'button', onclick: () => { s.photo = ''; touch(); rerender(); }, text: 'Remove image' }) : null);
  }

  // Race and breakdown slides can take their numbers from a homework upload instead of the boxes below.
  function hwSourceRow(s, render) {
    const id = 'sl-' + s.id + '-src', cur = hwSource(s);
    const sel = h('select', { id }, h('option', { value: '', text: 'Typed in below' }), Object.entries(HOMEWORK).map(([k, v]) => h('option', { value: k, text: v.name + ' upload' })));
    sel.value = cur;
    const d = cur && store.homework[cur];
    const note = h('p', { class: 'hint', text: !cur ? '' : d && d.uploadedAt ? 'Using the ' + HOMEWORK[cur].name + ' upload from ' + agoText(d.uploadedAt) + '. The boxes below are ignored while it has numbers for this year.' : 'No ' + HOMEWORK[cur].name + ' upload yet, so the boxes below are shown. Upload it on the home page.' });
    sel.addEventListener('change', () => { s.source = sel.value; touch(); render(); });
    return h('div', { class: 'wide' }, h('label', { class: 'f', for: id }, 'Numbers come from', sel), note);
  }
  function slideCard(s, i, render) {
    const t = SLIDE_TYPES[s.type] || { label: s.type, hint: '' };
    const F = (label, k, type = 'text', extra = {}, wide = false) => { const f = field(label, 'sl-' + s.id + '-' + k, s[k], v => s[k] = v, type, extra); return wide ? h('div', { class: 'wide' }, f) : f; };
    const body = h('div', { class: 'item' });
    switch (s.type) {
      case 'list': body.append(F('Title', 'title', 'text', {}, true), F('Small heading (optional)', 'subtitle', 'text', {}, true),
        F('Students, one per line ("Name, 7B")', 'items', 'textarea', { rows: 6 }, true), F('Shown when the list is empty (leave blank to skip the slide)', 'emptyText', 'text', {}, true)); break;
      case 'stat': body.append(hwSourceRow(s, render), F('Title', 'title'), F('What the number means', 'metric'), F('Unit (e.g. %)', 'unit'),
        h('div', { class: 'wide groups-form' }, groupsOf(store.screens[y]).map(L => h('div', { style: '--hc:' + suffixColor(L) },
          field(y.slice(1) + L, 'sl-' + s.id + '-v' + L, (s.values || {})[L] ?? '', v => { s.values = s.values || {}; s.values[L] = v; }, 'number', { step: 'any', inputmode: 'decimal' }))))); break;
      case 'breakdown': {
        body.append(hwSourceRow(s, render), F('Title', 'title'), F('What it shows', 'metric'));
        const box = h('div', { class: 'wide segs' });
        const rs = () => box.replaceChildren(...s.segments.map((x, k) => h('div', { class: 'seg', style: '--hc:' + SEG[k % SEG.length] },
          field('Part ' + (k + 1), 'sl-' + s.id + '-sl' + k, x.label, v => x.label = v), field('%', 'sl-' + s.id + '-sv' + k, x.value, v => x.value = v, 'number', { step: 'any', inputmode: 'decimal' }),
          h('button', { class: 'btn small ghost', type: 'button', onclick: () => { s.segments.splice(k, 1); touch(); rs(); }, text: 'Remove' }))),
          ...(s.segments.length < 5 ? [h('button', { class: 'btn small', type: 'button', style: 'justify-self:start', onclick: () => { s.segments.push({ label: '', value: 0 }); touch(); rs(); }, text: 'Add part' })] : []));
        rs(); body.append(box); break;
      }
      case 'table': body.append(F('Title', 'title'), F('Small heading (optional)', 'subtitle'), F('Rows', 'rows', 'textarea', { rows: 7, placeholder: 'Name\tTutor\tPoints' }, true)); break;
      case 'birthdays': body.append(F('Title', 'title', 'text', {}, true), F('Students, one per line ("Name, 7B, dd/mm")', 'people', 'textarea', { rows: 6 }, true),
        h('p', { class: 'note wide', text: 'A stopgap: once connected, Arbor can supply birthdays automatically.' })); break;
      case 'value': body.append(F('Heading', 'title'), F('Value', 'value'), F('A sentence about it (optional)', 'text', 'textarea', {}, true), photoRow(s, render)); break;
      case 'poster': body.append(F('Name (for staff)', 'title', 'text', {}, true), photoRow(s, render)); break;
      case 'info': body.append(F('Title', 'title', 'text', {}, true), F('Text', 'body', 'textarea', { rows: 8 }, true)); break;
      case 'week': body.append(h('p', { class: 'hint wide', text: 'Worked out from the school week plan (this week: ' + (w => w ? [w.letter && 'Week ' + w.letter, weekLine(w)].filter(Boolean).join(', ') : 'no school weeks left in the plan')(weekInfo(new Date())) + '). Fill these in only to override it.' }), F('Week (A or B)', 'week'), F('Teaching week number', 'teachingWeek'), F('Small heading (optional)', 'title', 'text', {}, true)); break;
      case 'housepoints': body.append(F('Title', 'title', 'text', {}, true)); break;
    }
    const showId = 'sl-' + s.id + '-show';
    const show = h('input', { type: 'checkbox', id: showId }); show.checked = !s.hidden;
    const summary = h('span', { class: 'stitle', text: s.title || s.value || t.label });
    const card = h('div', { class: 'scard' + (s.hidden ? ' off' : '') + (selected === s.id ? ' sel' : ''), id: 'sc-' + s.id, onfocusin: () => focusSlide(s.id), onclick: () => focusSlide(s.id), oninput: () => { summary.textContent = s.title || s.value || t.label; } },
      h('div', { class: 'shead' }, h('span', { class: 'pill', text: t.label }), summary, h('label', { class: 'showtog', for: showId }, show, 'On screen')),
      t.hint ? h('p', { class: 'hint', text: t.hint }) : null, body,
      h('div', { class: 'tools', style: 'display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap' }, moveBtns(draft.slides, i, render), removeBtn(draft.slides, i, render)));
    show.addEventListener('change', () => { s.hidden = !show.checked; card.classList.toggle('off', s.hidden); touch(); });
    return card;
  }

  function buildForm() {
    form.replaceChildren();
    const list = h('div', { class: 'items' });
    const render = () => list.replaceChildren(...(draft.slides.length ? draft.slides.map((s, i) => slideCard(s, i, render)) : [h('div', { class: 'empty', text: 'No slides yet. Add one below.' })]));
    render();
    const typeSel = h('select', { id: 'add-type' }, Object.entries(SLIDE_TYPES).map(([k, v]) => h('option', { value: k, text: v.label })));
    form.append(
      h('fieldset', {}, h('legend', { text: SIDES[side] + ' screen slides' }),
        h('p', { class: 'hint', text: 'Slides play top to bottom, and empty ones are skipped on the TV. Click a slide to edit it and preview it on its own.' }),
        list,
        h('div', { class: 'addrow' }, h('label', { class: 'f', for: 'add-type' }, 'New slide', typeSel),
          h('button', { class: 'btn', type: 'button', onclick: () => {
            const s = newSlide(typeSel.value); draft.slides.push(s); touch(); render(); focusSlide(s.id);
            const el = document.getElementById('sc-' + s.id); if (el) { el.scrollIntoView({ block: 'center' }); const f = el.querySelector('input:not([type=checkbox]), textarea'); f && f.focus(); }
          }, text: 'Add slide' }))),
      h('fieldset', {}, h('legend', { text: 'Screen settings' }),

    if (readOnly) form.querySelectorAll('input, textarea, button, select').forEach(el => el.disabled = true);

  async function save() {
    if (saving || readOnly) return;
    if (!db) { setStatus('Sign in to save.', 'bad'); return; }
    saving = true; saveBtn.disabled = true; setStatus('Saving…');
    const clean = clone(draft); clean.updatedAt = new Date().toISOString();
    try {
      await db.doc('screens/' + key).set(clean);
      dirty = false; banner.hidden = true; seen = JSON.stringify(clean);
      setStatus('Saved. Screens update within a few seconds.', 'ok');
    } catch (e) {
      setStatus(e && e.code === 'invalid_argument' ? 'You can view this screen but not change it. Ask the screens administrator for edit access.' : 'Not saved. Check your connection and press Save again.', 'bad');
    } finally { saving = false; saveBtn.disabled = readOnly; }
  }
  function loadRemote() {
    draft = normalSide(store.screens[key]); seen = JSON.stringify(store.screens[key] || null);
    dirty = false; banner.hidden = true; buildForm(); refresh(); setStatus('');
  }
  const onData = yy => {
    if (yy !== y) return;
    const now = JSON.stringify(store.screens[key] || null);
    if (now !== seen) {

      if (!saving) banner.hidden = false;

    refresh();

  listeners.add(onData);
  buildForm(); refresh(); subscribe(y);
  if (dbState === 'off') setStatus('Sign in to load and save this screen.', 'bad');
  if (user && user.can) Promise.resolve(user.can('data.write')).then(ok => { if (ok === false) { readOnly = true; saveBtn.disabled = true; setStatus('View only. Ask the screens administrator for edit access.'); buildForm(); } }).catch(() => {});

  window.addEventListener('beforeunload', beforeUnload);
  cleanup = () => { listeners.delete(onData); stage.destroy(); window.removeEventListener('beforeunload', beforeUnload); };
}

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.86));
  } catch (e) { return file; }
}

  h('span', { text: 'Demo mode: sample data, and changes are saved in this browser only.' }),
  h('button', { class: 'btn ghost', type: 'button', text: 'Reset', onclick: () => window.SCREENS_BACKEND.reset() })));

(async () => {
  try {
    for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));

  } catch (e) { dbState = 'off'; }
  route();
})();
})();
